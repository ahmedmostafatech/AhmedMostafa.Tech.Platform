<!DOCTYPE html>
<html lang="ar" dir="rtl" class="guard-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>مشاهدة المحاضرة | أحمد مصطفى تك</title>
  <link rel="icon" href="data:,">

  <!-- خطوط جوجل -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">

  <noscript>
    <style>html.guard-pending body { visibility: visible; }</style>
  </noscript>

  <style>
    body {
      background: #090e1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* شريط علوي أنيق ومظلم للمشاهدة */
    .watch-topbar {
      background: #071022;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: var(--space-3) var(--space-5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .watch-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 0;
      max-width: 1600px;
      margin-inline: auto;
      width: 100%;
    }

    @media (max-width: 960px) {
      .watch-layout {
        grid-template-columns: 1fr;
      }
    }

    /* منطقة المشغل */
    .watch-main-stage {
      padding: var(--space-5);
      background: #090e1a;
      overflow-y: auto;
    }

    @media (max-width: 600px) {
      .watch-main-stage {
        padding: var(--space-2) var(--space-3);
      }
    }

    .watch-player-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      position: relative;
    }

    .watch-video-meta {
      margin-top: var(--space-4);
      padding: var(--space-4);
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-lg);
    }

    .watch-nav-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: var(--space-4);
      padding-top: var(--space-4);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    /* قائمة الدروس الجانبية (Playlist) */
    .watch-sidebar {
      background: #0b1329;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 65px);
      position: sticky;
      top: 65px;
      overflow-y: auto;
    }

    @media (max-width: 960px) {
      .watch-sidebar {
        height: auto;
        position: static;
        border-right: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
    }

    .watch-sidebar-header {
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: #071022;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .playlist-module {
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .playlist-module__title {
      padding: var(--space-3) var(--space-4);
      background: rgba(255, 255, 255, 0.03);
      font-size: var(--text-xs);
      font-weight: 700;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) var(--space-4);
      color: #cbd5e1;
      text-decoration: none;
      font-size: var(--text-sm);
      transition: all var(--transition-fast);
      border-right: 3px solid transparent;
      gap: var(--space-3);
    }

    .playlist-item:hover {
      background: rgba(54, 90, 162, 0.15);
      color: #fff;
    }

    .playlist-item.active {
      background: rgba(54, 90, 162, 0.25);
      border-right-color: var(--color-accent);
      color: #fff;
      font-weight: 700;
    }

    .playlist-item.locked {
      opacity: 0.6;
    }

    /* كارت المحاضرة المغلقة */
    .locked-video-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-10) var(--space-5);
      background: #0f172a;
      border-radius: var(--radius-xl);
      height: 100%;
    }
  </style>
</head>

<body>

  <!-- شريط المشاهدة العلوي -->
  <header class="watch-topbar">
    <div style="display:flex; align-items:center; gap:var(--space-3);">
      <a href="dashboard.html" class="btn btn--secondary btn--sm" style="color:#e2e8f0; border-color:rgba(255,255,255,0.15); border-radius:var(--radius-full); font-size:var(--text-xs);">
        ← لوحة التحكم
      </a>
      <div style="height:20px; width:1px; background:rgba(255,255,255,0.1);"></div>
      <div>
        <div id="topbar-course-title" style="font-weight:800; font-size:var(--text-sm); color:#fff;">
          جاري التحميل...
        </div>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:var(--space-3);">
      <span id="user-display-badge" class="badge" style="background:rgba(255,255,255,0.08); color:#94a3b8; font-size:var(--text-xs);">
        👤 طالب
      </span>
      <a href="course.html" id="course-page-link" class="btn btn--secondary btn--sm" style="color:#93c5fd; border-color:rgba(147,197,253,0.3); border-radius:var(--radius-full); font-size:var(--text-xs);">
        تفاصيل المادة ℹ️
      </a>
    </div>
  </header>

  <!-- جسم الصفحة: المشغل + قائمة الدروس -->
  <div class="watch-layout">

    <!-- مساحة المشغل الرئيسية -->
    <main class="watch-main-stage">

      <!-- حاوية المشغل (فيديو أو كارت قفل) -->
      <div id="watch-player-box" class="watch-player-box">
        <div class="skeleton" style="width:100%; height:100%;"></div>
      </div>

      <!-- معلومات المحاضرة الحالية -->
      <div class="watch-video-meta">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:var(--space-2);">
          <span id="video-module-tag" class="badge badge--accent" style="font-size:var(--text-xs);">الفصل الأول</span>
          <span id="video-access-badge" class="badge" style="font-size:var(--text-xs);">مفتوح</span>
        </div>

        <h1 id="video-current-title" style="font-size:var(--text-xl); font-weight:800; color:#fff; margin-bottom:var(--space-2);">
          جاري تحميل عنوان المحاضرة...
        </h1>

        <div style="font-size:var(--text-xs); color:#94a3b8; display:flex; align-items:center; gap:var(--space-4);">
          <span id="video-duration-tag">⏱️ — دقيقة</span>
          <span>🎓 منصة أحمد مصطفى تك</span>
        </div>

        <!-- أزرار التنقل بين الدروس والدعم -->
        <div class="watch-nav-actions">
          <button type="button" id="prev-video-btn" class="btn btn--secondary btn--sm" style="color:#fff; border-color:rgba(255,255,255,0.15); border-radius:var(--radius-full);" disabled>
            ← المحاضرة السابقة
          </button>

          <a href="https://wa.me/201066843568" target="_blank" rel="noopener" class="btn btn--secondary btn--sm" style="color:#4ade80; border-color:rgba(74,222,128,0.3); border-radius:var(--radius-full); font-size:var(--text-xs);">
            💬 اسأل المستر على واتساب
          </a>

          <button type="button" id="next-video-btn" class="btn btn--primary btn--sm" style="border-radius:var(--radius-full);" disabled>
            المحاضرة التالية →
          </button>
        </div>
      </div>

    </main>

    <!-- الشريط الجانبي (قائمة المحاضرات) -->
    <aside class="watch-sidebar">
      <div class="watch-sidebar-header">
        <div style="font-weight:800; font-size:var(--text-sm); color:#fff; display:flex; align-items:center; gap:6px;">
          <span>📑</span> قائمة المحاضرات
        </div>
        <span id="playlist-count-badge" style="font-size:var(--text-xs); color:#94a3b8;">
          0 دروس
        </span>
      </div>

      <!-- قائمة الفصول والدروس -->
      <div id="playlist-container" style="flex:1; overflow-y:auto;">
        <div style="padding:var(--space-4);">
          <div class="skeleton" style="height:44px; margin-bottom:8px; border-radius:var(--radius-md);"></div>
          <div class="skeleton" style="height:44px; margin-bottom:8px; border-radius:var(--radius-md);"></div>
          <div class="skeleton" style="height:44px; border-radius:var(--radius-md);"></div>
        </div>
      </div>
    </aside>

  </div>

  <script type="module" src="assets/js/pages/watch-page.js"></script>

</body>
</html>
