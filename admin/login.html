<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>دخول الإدارة | أحمد مصطفى تك</title>
  <link rel="icon" href="data:,">

  <!-- الخطوط الرسمية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- مكتبة الأيقونات الرسمية Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- ملفات الـ CSS -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/admin.css">

  <style>
    body {
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #0f172a;
      position: relative;
    }

    .admin-login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      position: relative;
      z-index: 2;
    }

    .admin-login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .admin-login-brand-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd154;
      font-size: 1.3rem;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }

    .admin-login-input {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      border-radius: 12px;
      padding: 12px 16px;
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .admin-login-input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .admin-login-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <div class="admin-login-card">
    <div class="admin-login-brand">
      <div class="admin-login-brand-icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div>
        <div style="font-weight:900; font-size:18px; color:#0f172a;">أحمد مصطفى تك</div>
        <div style="font-size:12px; color:#2563eb; font-weight:700;">لوحة الإدارة والمتابعة</div>
      </div>
    </div>

    <div id="login-error" class="alert alert--error" hidden role="alert"
      style="margin-bottom:20px; font-size:13px; border-radius:12px;"></div>

    <form id="admin-login-form">
      <div style="margin-bottom:18px;">
        <label class="admin-login-label" for="admin-email">
          <i class="fa-solid fa-envelope" style="color:#2563eb;"></i>
          البريد الإلكتروني للإدارة
        </label>
        <input type="email" id="admin-email" class="admin-login-input" placeholder="admin@ahmedmostafa.tech" required
          dir="ltr">
      </div>

      <div style="margin-bottom:26px;">
        <label class="admin-login-label" for="admin-pass">
          <i class="fa-solid fa-key" style="color:#d97706;"></i>
          كلمة المرور
        </label>
        <input type="password" id="admin-pass" class="admin-login-input" placeholder="••••••••" required dir="ltr">
      </div>

      <button type="submit" id="admin-submit-btn" class="btn btn--accent btn--block"
        style="min-height:48px; border-radius:12px; font-size:14px; font-weight:800;">
        <span>تسجيل الدخول للوحة التحكم</span>
        <i class="fa-solid fa-arrow-left"></i>
      </button>
    </form>

    <div style="text-align:center; margin-top:24px; padding-top:16px; border-top:1px solid #e2e8f0;">
      <a href="../index.html"
        style="font-size:13px; color:#64748b; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-weight:700;">
        <i class="fa-solid fa-arrow-right"></i>
        <span>العودة للموقع الرئيسي</span>
      </a>
    </div>
  </div>

  <script type="module" src="../assets/js/pages/admin/admin-login-page.js"></script>

</body>

</html>
