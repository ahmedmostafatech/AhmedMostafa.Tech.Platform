<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>دخول الإدارة | أحمد مصطفى تك</title>
  <link rel="icon" href="data:,">

  <!-- الخطوط الرسمية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- مكتبة الأيقونات الرسمية Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- ملفات الـ CSS -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">

  <style>
    body {
      background: #040914;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .login-bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(54, 90, 162, 0.22) 0%, rgba(255, 209, 84, 0.04) 40%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .admin-login-card {
      background: rgba(14, 25, 48, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      z-index: 2;
    }

    .admin-login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .admin-login-brand-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd154;
      font-size: 1.3rem;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    }

    .admin-login-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      border-radius: 14px;
      padding: 13px 16px;
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .admin-login-input:focus {
      border-color: #3b82f6;
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .admin-login-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <div class="login-bg-glow"></div>

  <div class="admin-login-card spotlight-card">
    <div class="admin-login-brand">
      <div class="admin-login-brand-icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div>
        <div style="font-weight:900; font-size:18px; color:#fff;">أحمد مصطفى تك</div>
        <div style="font-size:12px; color:#9cbdfc; font-weight:600;">لوحة الإدارة والمتابعة</div>
      </div>
    </div>

    <div id="login-error" class="alert alert--error" hidden role="alert"
      style="margin-bottom:20px; font-size:13px; border-radius:12px;"></div>

    <form id="admin-login-form">
      <div style="margin-bottom:18px;">
        <label class="admin-login-label" for="admin-email">
          <i class="fa-solid fa-envelope" style="color:#72a2ff;"></i>
          البريد الإلكتروني للإدارة
        </label>
        <input type="email" id="admin-email" class="admin-login-input" placeholder="admin@ahmedmostafa.tech" required
          dir="ltr">
      </div>

      <div style="margin-bottom:26px;">
        <label class="admin-login-label" for="admin-pass">
          <i class="fa-solid fa-key" style="color:#ffd154;"></i>
          كلمة المرور
        </label>
        <input type="password" id="admin-pass" class="admin-login-input" placeholder="••••••••" required dir="ltr">
      </div>

      <button type="submit" id="admin-submit-btn" class="btn-interactive"
        style="width:100%; min-height:48px; border-radius:14px; font-size:14px;">
        <span class="btn-dot"></span>
        <span>تسجيل الدخول للوحة التحكم</span>
        <i class="fa-solid fa-arrow-left"></i>
      </button>
    </form>

    <div style="text-align:center; margin-top:24px; padding-top:16px; border-top:1px solid rgba(255, 255, 255, 0.08);">
      <a href="../index.html"
        style="font-size:12px; color:rgba(255, 255, 255, 0.5); text-decoration:none; display:inline-flex; align-items:center; gap:6px; transition:color 0.2s ease;">
        <i class="fa-solid fa-arrow-right"></i>
        <span>العودة للموقع الرئيسي</span>
      </a>
    </div>
  </div>

  <script type="module" src="../assets/js/pages/admin/admin-login-page.js"></script>

</body>

</html>
